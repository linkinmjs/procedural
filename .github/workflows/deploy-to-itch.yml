name: Godot Export and Upload to Itch

on:
  push:
    branches: [master]
  pull_request:

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"
  # El proyecto Godot vive en la raiz del repositorio, no en una subcarpeta.
  PROJECT_PATH: "./"

jobs:
  import-assets:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4
        with:
          # Los assets binarios (png/res/glb/ogg) estan en Git LFS.
          # Sin esto el checkout deja punteros de texto y el import falla.
          lfs: true
      - name: Marcar el workspace como seguro para git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache import assets
        uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: import-assets-${{ runner.os }}-${{ github.sha }}
      - name: Import assets
        run: godot --headless --verbose --editor --quit

  export-game:
    runs-on: ubuntu-latest
    needs: import-assets
    steps:
      - uses: actions/checkout@v4
        with:
          # Los assets binarios (png/res/glb/ogg) estan en Git LFS.
          # Sin esto el checkout deja punteros de texto y el import falla.
          lfs: true
      - uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: import-assets-${{ runner.os }}-${{ github.sha }}
      - name: Export Game using Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz"
          relative_project_path: ${{ env.PROJECT_PATH }}
          archive_output: true
          presets_to_export: Web
          cache: false
      - name: Upload HTML5
        uses: actions/upload-artifact@v4
        with:
          name: HTML5
          path: /home/runner/.local/share/godot/archives/Web.zip

  deploy-to-itchio-web:
    runs-on: ubuntu-latest
    needs: export-game
    # Solo se publica en itch desde la rama principal, nunca desde un PR.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HTML5
      # Falla temprano y con un mensaje claro si falta algun dato de itch.
      # Sin esto, butler recibe "/:web" y el error resultante no dice cual falta.
      - name: Verificar credenciales de itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY || vars.BUTLER_API_KEY }}
          ITCH_GAME: ${{ secrets.ITCHIO_GAME || vars.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME || vars.ITCHIO_USERNAME }}
        run: |
          faltan=0
          if [ -z "$BUTLER_API_KEY" ]; then echo "::error::Falta BUTLER_API_KEY"; faltan=1; fi
          if [ -z "$ITCH_USER" ]; then echo "::error::Falta ITCHIO_USERNAME"; faltan=1; fi
          if [ -z "$ITCH_GAME" ]; then echo "::error::Falta ITCHIO_GAME"; faltan=1; fi
          if [ "$faltan" = "1" ]; then
            echo "Revisa Settings > Secrets and variables > Actions del repositorio."
            exit 1
          fi
          echo "Destino: $ITCH_USER/$ITCH_GAME:web"

      - name: Deploy to Itch.io (HTML5)
        uses: manleydev/butler-publish-itchio-action@master
        env:
          # butler lee BUTLER_API_KEY; la action reexporta BUTLER_CREDENTIALS
          # hacia esa variable, asi que se pasan ambas.
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY || vars.BUTLER_API_KEY }}
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY || vars.BUTLER_API_KEY }}
          CHANNEL: web
          ITCH_GAME: ${{ secrets.ITCHIO_GAME || vars.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME || vars.ITCHIO_USERNAME }}
          PACKAGE: Web.zip
